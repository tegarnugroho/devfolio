<!doctype html>
<html lang="%portfolio.language%" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website description for SEO -->
    <meta
      name="description"
      content="%portfolio.description%"
    />

    <!-- Open Graph metadata for social media previews -->
    <meta property="og:title" content="%portfolio.title%" />
    <meta
      property="og:description"
      content="%portfolio.socialDescription%"
    />
    <meta property="og:type" content="website" />

    <!-- Important: Site name used by Google Search -->
    <meta property="og:site_name" content="%portfolio.portfolioName%" />

    <!-- Application name used by browsers and Google -->
    <meta name="application-name" content="%portfolio.portfolioName%" />

    <!-- Theme colors for dark/light mode -->
    <meta name="theme-color" content="#0B0C0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F2" media="(prefers-color-scheme: light)" />

    <!-- Favicon icons -->
    <link rel="icon" type="image/x-icon" href="%portfolio.favicon%" />
    <link rel="shortcut icon" type="image/x-icon" href="%portfolio.favicon%" />

    <!-- Web App Manifest (helps Google show correct site name) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Browser tab title -->
    <title>%portfolio.title%</title>
  </head>

  <body class="antialiased transition-colors duration-300">
    <!-- Vue app root element -->
    <div id="app"></div>

    <!-- Load main TypeScript entry file -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
